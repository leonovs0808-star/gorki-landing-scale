<script>
document.addEventListener('DOMContentLoaded', function() {

  /* ===== MOBILE SCROLL FIX: force scroll capability ===== */

  /* ===== MOVE MBA ROBOT SVG after "рамки администрирования" paragraph ===== */
  var robotSvg = document.querySelector('svg[viewBox="0 0 400 320"]');
  if (robotSvg) {
    var robotWrapper = robotSvg.closest('.mb-8') || robotSvg.parentElement.parentElement;
    // Find the paragraph with "рамки администрирования"
    var allParagraphs = document.querySelectorAll('p');
    var targetP = null;
    for (var i = 0; i < allParagraphs.length; i++) {
      if (allParagraphs[i].textContent.indexOf('рамки администрирования') !== -1) {
        targetP = allParagraphs[i];
        break;
      }
    }
    if (targetP) {
      // Insert robot right after THIS paragraph, not the parent container
      targetP.parentNode.insertBefore(robotWrapper, targetP.nextSibling);
    }

  /* ===== FIX REACT TRANSFORMS (only non-interactive elements) ===== */
  document.querySelectorAll('[style*="translateX"], [style*="translateY"]').forEach(function(el) {
    // Skip marquiz, carousels, interactive elements, Tilda wrappers, and nav
    if (el.closest('[data-marquiz-id], [id*="marquiz"], .marquiz__container, [data-carousel-slide], nav, .t-rec, .t123, .t-body')) return;
    // Skip elements that are direct children of body or Tilda containers
    if (el.tagName === 'NAV' || el.classList.contains('t-rec') || el.classList.contains('t123')) return;
    el.style.transform = 'none';
  });

  /* ===== FIX DOT PATTERNS ===== */
  document.querySelectorAll('[class*="pointer-events-none"]').forEach(function(el) {
    if (el.className.indexOf('opacity') !== -1) {
      el.style.display = 'none';
    }
  });

  /* ===== FIX PROGRAM TREE STRATEGIES — RESPONSIVE ===== */
  function fixTreeLayout() {
    var programSection = document.getElementById('program');
    if (!programSection) return;

    // Direct CSS selector for the tree flex container
    var flexParent = programSection.querySelector('[class*="hidden"][class*="md\\:flex"]');
    if (!flexParent) return;

    // Find tree image
    var treeImg = flexParent.querySelector('img[alt*="Методика"], img[alt*="дерево"], img[alt*="tree"]');
    if (!treeImg) {
      // Fallback: find any large image in the container
      var imgs = flexParent.querySelectorAll('img');
      for (var i = 0; i < imgs.length; i++) {
        if (imgs[i].src.indexOf('tree') !== -1 || imgs[i].src.indexOf('gorki-tree') !== -1) {
          treeImg = imgs[i];
          break;
        }
      }
      if (!treeImg && imgs.length > 0) treeImg = imgs[0];
    }
    if (!treeImg) return;

    var isMobile = window.innerWidth < 768;

    // Force flexParent visible FIRST
    flexParent.style.setProperty('display', 'flex', 'important');
    flexParent.style.position = 'relative';

    // Find tree container and strategies
    var treeContainer = treeImg.closest('[class*="shrink-0"]') || treeImg.parentElement;
    var strategies = [];
    Array.from(flexParent.children).forEach(function(child) {
      if (child.contains(treeImg)) {
        treeContainer = child;
      } else if (child.querySelector('h3') || (child.style && child.style.top)) {
        strategies.push(child);
      }
    });
    if (!treeContainer || strategies.length === 0) return;

    // Hide mobile fallback — search broadly for any element with md:hidden that has strategy h3s
    programSection.querySelectorAll('*').forEach(function(el) {
      if (el === flexParent || flexParent.contains(el)) return;
      if (el.className && el.className.indexOf('md:hidden') !== -1 && el.querySelector('h3')) {
        el.style.display = 'none';
      }
    });

    // Force show the desktop tree container
    flexParent.style.display = 'flex';
    flexParent.style.position = 'relative';
    flexParent.style.alignItems = 'stretch';

    // Positions by screen size
    var isSmallMobile = window.innerWidth < 400;
    var isTablet = window.innerWidth >= 768 && window.innerWidth < 1024;

    var positions, containerHeight, treeWidth;
    if (isSmallMobile || isMobile) {
      // MOBILE: side-by-side, tree LEFT 50%, strategies RIGHT 50%, full screen height
      var screenH = window.innerHeight;

      flexParent.style.setProperty('display', 'flex', 'important');
      flexParent.style.flexDirection = 'row';
      flexParent.style.position = 'relative';
      flexParent.style.height = screenH + 'px';
      flexParent.style.minHeight = screenH + 'px';
      flexParent.style.overflow = 'hidden';
      flexParent.style.alignItems = 'stretch';
      flexParent.style.padding = '0';

      // Tree container: LEFT half, full height
      treeContainer.style.position = 'relative';
      treeContainer.style.width = '45%';
      treeContainer.style.height = '100%';
      treeContainer.style.flexShrink = '0';
      treeContainer.style.display = 'block';
      treeContainer.style.overflow = 'hidden';

      var treeImgEl = treeContainer.querySelector('img');
      if (treeImgEl) {
        treeImgEl.style.width = '100%';
        treeImgEl.style.height = '100%';
        treeImgEl.style.objectFit = 'cover';
        treeImgEl.style.objectPosition = 'center center';
        treeImgEl.style.opacity = '1';
        treeImgEl.style.maxWidth = 'none';
      }

      // RIGHT half: strategies absolutely positioned at tree levels
      // Crown = ~15%, Trunk = ~50%, Roots = ~80%
      var rightPositions = [
        { top: '8%' },   // crown — Стратегия направлений
        { top: '45%' },  // trunk — Стратегия компании
        { top: '75%' }   // roots — Стратегия жизни
      ];

      strategies.forEach(function(child, idx) {
        if (idx >= 3) return;
        child.style.position = 'absolute';
        child.style.top = rightPositions[idx].top;
        child.style.left = '46%';
        child.style.right = '0.5rem';
        child.style.opacity = '1';
        child.style.transform = 'none';
        child.style.display = 'flex';
        child.style.flexDirection = 'column';
        child.style.zIndex = '1';
        child.style.overflow = 'visible';
        child.style.width = 'auto';
        child.style.maxWidth = 'none';
        child.style.marginLeft = '0';
        child.style.marginBottom = '0';
      });

      // Fonts sized for mobile
      flexParent.querySelectorAll('h3').forEach(function(h) {
        h.style.fontSize = isSmallMobile ? '0.7rem' : '0.8rem';
        h.style.marginBottom = '0.15rem';
        h.style.fontWeight = '700';
        h.style.lineHeight = '1.2';
        h.style.marginLeft = '0';
        h.style.whiteSpace = 'normal';
      });

      // Tags horizontal, compact
      flexParent.querySelectorAll('[class*="flex-wrap"]').forEach(function(wrap) {
        wrap.style.display = 'flex';
        wrap.style.flexDirection = 'row';
        wrap.style.flexWrap = 'wrap';
        wrap.style.gap = '0.15rem';
        wrap.style.marginLeft = '0';
        wrap.style.marginTop = '0.15rem';
      });
      flexParent.querySelectorAll('[class*="flex-wrap"] span, [class*="flex-wrap"] div').forEach(function(tag) {
        if (tag.tagName === 'SPAN' || (tag.className && tag.className.indexOf('rounded') !== -1)) {
          tag.style.fontSize = isSmallMobile ? '0.45rem' : '0.5rem';
          tag.style.padding = '0.1rem 0.2rem';
          tag.style.margin = '0';
          tag.style.display = 'inline-flex';
        }
      });

      // Green dots/lines: smaller on mobile
      flexParent.querySelectorAll('.flex.items-center').forEach(function(row) {
        // This is the dot + line container
        var dot = row.querySelector('[class*="rounded-full"][class*="bg-primary"]');
        var line = row.querySelector('[class*="h-"][class*="bg-primary"]');
        if (dot && parseInt(window.getComputedStyle(dot).width) > 8) {
          dot.style.width = '8px';
          dot.style.height = '8px';
        }
        if (line) {
          line.style.height = '1.5px';
          line.style.width = '100%';
        }
      });

      return; // Skip desktop/tablet code
    } else if (isTablet) {
      positions = [
        { top: '25%', left: '28%', right: '4%' },
        { top: '55%', left: '20%', right: '4%' },
        { top: '74%', left: '25%', right: '4%' }
      ];
      containerHeight = '450px';
      treeWidth = '40%';
    } else {
      positions = [
        { top: '28%', left: '30%', right: '4%' },
        { top: '58%', left: '20%', right: '4%' },
        { top: '74%', left: '28%', right: '4%' }
      ];
      containerHeight = '500px';
      treeWidth = '45%';
    }

    flexParent.style.minHeight = containerHeight;
    flexParent.style.overflow = 'hidden';

    // Tree container sizing — fills full height
    treeContainer.style.width = treeWidth;
    treeContainer.style.flexShrink = '0';
    treeContainer.style.display = 'flex';
    treeContainer.style.alignItems = 'stretch';
    treeContainer.style.justifyContent = 'center';
    treeContainer.style.position = 'relative';
    treeContainer.style.height = '100%';
    treeContainer.style.minHeight = containerHeight;
    // Make tree image fill the full height on ALL screens
    var treeImgEl = treeContainer.querySelector('img');
    if (treeImgEl) {
      treeImgEl.style.width = '100%';
      treeImgEl.style.height = '100%';
      treeImgEl.style.objectFit = 'cover';
      treeImgEl.style.objectPosition = 'center center';
      if (isMobile) {
        treeImgEl.style.objectPosition = 'right center';
      }
    }

    // Position strategies absolutely
    strategies.forEach(function(child, idx) {
      if (idx >= 3) return;
      child.style.position = 'absolute';
      child.style.top = positions[idx].top;
      child.style.left = positions[idx].left;
      child.style.right = positions[idx].right;
      child.style.opacity = '1';
      child.style.transform = 'none';
      child.style.display = 'flex';
      child.style.flexDirection = 'column';
      child.style.maxWidth = isMobile ? '70%' : '';
      child.style.overflow = 'hidden';
    });

    // Mobile font adjustments
    if (isMobile) {
      flexParent.querySelectorAll('h3').forEach(function(h) {
        h.style.fontSize = isSmallMobile ? '0.85rem' : '1rem';
        h.style.marginBottom = '0.25rem';
        h.style.lineHeight = '1.3';
        h.style.fontWeight = '700';
      });
      flexParent.querySelectorAll('[class*="flex-wrap"] span, [class*="flex-wrap"] div').forEach(function(tag) {
        if (tag.tagName === 'SPAN' || (tag.className && tag.className.indexOf('rounded') !== -1)) {
          tag.style.fontSize = isSmallMobile ? '0.45rem' : '0.5rem';
          tag.style.padding = '0.1rem 0.25rem';
          tag.style.margin = '0.05rem';
          tag.style.whiteSpace = 'nowrap';
        }
      });
      // Green lines — thinner on mobile
      flexParent.querySelectorAll('[class*="bg-primary"][class*="rounded-full"]').forEach(function(dot) {
        var w = parseInt(window.getComputedStyle(dot).width);
        if (w > 10) { dot.style.width = '8px'; dot.style.height = '8px'; }
      });
      // Green lines (the horizontal bars)
      flexParent.querySelectorAll('[class*="bg-primary"][class*="h-"]').forEach(function(line) {
        var h = parseInt(window.getComputedStyle(line).height);
        if (h <= 3 && parseInt(window.getComputedStyle(line).width) > 50) {
          line.style.height = '1px';
        }
      });
    }
    return;

    // Desktop/tablet
    {
      // Desktop/tablet: absolute positioning
      flexParent.style.flexDirection = '';
      flexParent.style.alignItems = 'stretch';
      flexParent.style.minHeight = '500px';
      flexParent.style.padding = '';
      // Tree container reset
      var treeContainer = treeImg.parentElement;
      treeContainer.style.width = '45%';
      treeContainer.style.maxWidth = '';
      treeContainer.style.margin = '';
      treeContainer.style.order = '';
      var positions = [
        { top: '28%', left: '30%', right: '4%' },
        { top: '58%', left: '20%', right: '4%' },
        { top: '74%', left: '28%', right: '4%' }
      ];
      strategies.forEach(function(child, idx) {
        if (idx < 3) {
          child.style.position = 'absolute';
          child.style.top = positions[idx].top;
          child.style.left = positions[idx].left;
          child.style.right = positions[idx].right;
          child.style.width = '';
          child.style.opacity = '1';
          child.style.marginBottom = '';
          child.style.textAlign = '';
        }
      });
    }
  }
  fixTreeLayout();
  window.addEventListener('resize', fixTreeLayout);

  /* ===== FIX CAROUSEL DOTS SPACING ===== */
  var firstDot = document.querySelector('[data-carousel-dot]');
  if (firstDot && firstDot.parentElement) {
    firstDot.parentElement.style.marginTop = '1.5rem';
    firstDot.parentElement.style.paddingBottom = '1rem';
  }

  /* ===== MOBILE BURGER MENU ===== */
  var burgerBtn = document.querySelector('button.lg\\:hidden');
  if (burgerBtn) {
    var navLinksContainer = document.querySelector('nav .hidden.lg\\:flex');
    // Create mobile menu
    var mobileMenu = document.createElement('div');
    mobileMenu.id = 'mobile-menu';
    mobileMenu.style.cssText = 'display:none;position:fixed;top:60px;left:0;right:0;bottom:0;background:hsl(160,55%,5%);z-index:49;padding:2rem;';
    if (navLinksContainer) {
      var links = navLinksContainer.querySelectorAll('a');
      links.forEach(function(link) {
        var a = document.createElement('a');
        a.href = link.href;
        a.textContent = link.textContent;
        a.style.cssText = 'display:block;color:hsl(155,35%,94%);font-size:1.125rem;padding:0.75rem 0;border-bottom:1px solid hsl(160,35%,12%);text-decoration:none;';
        a.addEventListener('click', function() {
          mobileMenu.style.display = 'none';
          burgerBtn.setAttribute('data-state', 'closed');
        });
        mobileMenu.appendChild(a);
      });
    }
    // Add CTA button to mobile menu
    var ctaLink = document.createElement('a');
    ctaLink.href = '#';
    ctaLink.textContent = 'Записаться';
    ctaLink.style.cssText = 'display:inline-block;margin-top:1.5rem;padding:0.75rem 2rem;background:hsl(160,45%,40%);color:white;border-radius:9999px;text-decoration:none;font-weight:600;text-align:center;';
    ctaLink.addEventListener('click', function(e) {
      e.preventDefault();
      mobileMenu.style.display = 'none';
      burgerBtn.setAttribute('data-state', 'closed');
      if (window.Marquiz) Marquiz.showModal('68c3bfd9cb49020019f482c8');
    });
    mobileMenu.appendChild(ctaLink);
    document.body.appendChild(mobileMenu);

    burgerBtn.addEventListener('click', function() {
      var isOpen = mobileMenu.style.display !== 'none';
      mobileMenu.style.display = isOpen ? 'none' : 'block';
      this.setAttribute('data-state', isOpen ? 'closed' : 'open');
    });
  }

  /* ===== SPEAKER HOVER TOOLTIPS ===== */
  var speakerData = {
    'Владимир Седов': { role: 'Основатель Askona Life Group и города Доброград', desc: 'Вырастил «Аскону» с 1,2 млрд до 100+ млрд выручки, 11 000 сотрудников, 19 стран.' },
    'Евгения Курчатова': { role: 'Со-основатель школы бизнеса «Горки»', desc: 'Сквозной педагог программы. Приземляет кейсы педагогов на реальность каждого студента.' },
    'Александр Барсуков': { role: 'Предприниматель, экс-CEO сети «Магнит»', desc: 'От товароведа в Ростове до CEO «Магнита»: 9+ бизнес-моделей, 300 000 сотрудников.' },
    'Михаил Воробьев': { role: 'Сооснователь «ЭР-Телеком» (бренд Дом.ru)', desc: 'Построил компанию с нуля до 100+ млрд выручки.' },
    'Игорь Хведук': { role: 'Основатель PERMEGI', desc: 'Лидер категории товаров для дома на маркетплейсах.' },
    'Дмитрий Тарасевич': { role: 'Со-основатель пивоваренной компании «ТАРКОС»', desc: '15+ лет стабильного роста из Воронежа, без московских ресурсов.' },
    'Виктор Семёнов': { role: 'Председатель НС группы компаний «Белая Дача»', desc: 'Создал рынок готовых салатов в России. Экс-министр сельского хозяйства РФ.' }
  };

  var tooltip = document.createElement('div');
  tooltip.style.cssText = 'position:fixed;z-index:50;width:14rem;padding:0.75rem;border-radius:0.75rem;border:1px solid hsl(160,45%,40%,0.3);background:hsl(160,35%,12%);box-shadow:0 10px 25px rgba(0,0,0,0.3);pointer-events:none;opacity:0;transition:opacity 0.2s;';
  document.body.appendChild(tooltip);

  document.querySelectorAll('.group.cursor-pointer').forEach(function(card) {
    var img = card.querySelector('img[alt]');
    if (!img || !speakerData[img.alt]) return;
    var data = speakerData[img.alt];

    card.addEventListener('mouseenter', function(e) {
      tooltip.innerHTML = '<h4 style="font-weight:700;font-size:0.875rem;color:hsl(155,35%,94%)">' + img.alt + '</h4>'
        + '<p style="color:hsl(160,45%,40%);font-size:0.75rem;font-weight:500;margin-top:2px">' + data.role + '</p>'
        + '<p style="color:hsl(160,20%,60%);font-size:0.75rem;margin-top:0.5rem;line-height:1.5">' + data.desc + '</p>';
      tooltip.style.opacity = '1';
    });
    card.addEventListener('mousemove', function(e) {
      tooltip.style.left = (e.clientX + 12) + 'px';
      tooltip.style.top = (e.clientY + 12) + 'px';
    });
    card.addEventListener('mouseleave', function() {
      tooltip.style.opacity = '0';
    });
    // Touch support
    card.addEventListener('click', function(e) {
      if (tooltip.style.opacity === '1') {
        tooltip.style.opacity = '0';
      } else {
        var rect = card.getBoundingClientRect();
        tooltip.innerHTML = '<h4 style="font-weight:700;font-size:0.875rem;color:hsl(155,35%,94%)">' + img.alt + '</h4>'
          + '<p style="color:hsl(160,45%,40%);font-size:0.75rem;font-weight:500;margin-top:2px">' + data.role + '</p>'
          + '<p style="color:hsl(160,20%,60%);font-size:0.75rem;margin-top:0.5rem;line-height:1.5">' + data.desc + '</p>';
        tooltip.style.left = rect.left + 'px';
        tooltip.style.top = (rect.bottom + 8) + 'px';
        tooltip.style.opacity = '1';
        setTimeout(function() { tooltip.style.opacity = '0'; }, 4000);
      }
    });
  });

  /* ===== SMOOTH SCROLL ===== */
  document.querySelectorAll('a[href^="#"]').forEach(function(link) {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      var targetId = this.getAttribute('href').substring(1);
      var target = document.getElementById(targetId);
      if (target) {
        var top = target.getBoundingClientRect().top + window.pageYOffset - 80;
        window.scrollTo({ top: top, behavior: 'smooth' });
      }
    });
  });

  /* ===== FAQ ACCORDION (works with existing data-state attributes) ===== */
  var faqSection = document.getElementById('faq');
  if (faqSection) {
    var faqButtons = faqSection.querySelectorAll('button[data-state]');
    faqButtons.forEach(function(btn) {
      btn.addEventListener('click', function() {
        var h3 = this.closest('h3');
        if (!h3) return;
        var contentDiv = h3.nextElementSibling;
        if (!contentDiv) return;

        var isOpen = this.getAttribute('data-state') === 'open';
        var icon = this.querySelector('svg');
        var parentItem = h3.parentElement;

        if (isOpen) {
          // Close
          contentDiv.removeAttribute('hidden');
          contentDiv.style.maxHeight = '0';
          contentDiv.style.overflow = 'hidden';
          contentDiv.style.opacity = '0';
          contentDiv.style.transition = 'max-height 0.3s ease, opacity 0.3s ease';
          this.setAttribute('data-state', 'closed');
          this.setAttribute('aria-expanded', 'false');
          if (contentDiv.getAttribute('data-state') !== null) contentDiv.setAttribute('data-state', 'closed');
          if (parentItem && parentItem.getAttribute('data-state') !== null) parentItem.setAttribute('data-state', 'closed');
          if (icon) icon.style.transform = 'rotate(0deg)';
          setTimeout(function() { contentDiv.setAttribute('hidden', ''); }, 300);
        } else {
          // Close all others first
          faqButtons.forEach(function(otherBtn) {
            if (otherBtn !== btn && otherBtn.getAttribute('data-state') === 'open') {
              otherBtn.click();
            }
          });

          // Open this one
          contentDiv.removeAttribute('hidden');
          contentDiv.style.overflow = 'hidden';
          contentDiv.style.maxHeight = '0';
          contentDiv.style.opacity = '0';
          contentDiv.style.transition = 'max-height 0.3s ease, opacity 0.3s ease';

          // Force reflow
          contentDiv.offsetHeight;

          contentDiv.style.maxHeight = contentDiv.scrollHeight + 'px';
          contentDiv.style.opacity = '1';
          this.setAttribute('data-state', 'open');
          this.setAttribute('aria-expanded', 'true');
          if (contentDiv.getAttribute('data-state') !== null) contentDiv.setAttribute('data-state', 'open');
          if (parentItem && parentItem.getAttribute('data-state') !== null) parentItem.setAttribute('data-state', 'open');
          if (icon) icon.style.transform = 'rotate(180deg)';
        }
      });
    });
  }

  /* ===== REVIEW CAROUSEL ===== */
  var carouselEl = document.querySelector('[data-carousel]');
  if (carouselEl) {
    var slides = carouselEl.querySelectorAll('[data-carousel-slide]');
    var allDots = document.querySelectorAll('[data-carousel-dot]');
    var counters = carouselEl.querySelectorAll('[data-carousel-counter]');
    var current = 0;
    var total = slides.length;

    function goToSlide(index) {
      if (index < 0) index = total - 1;
      if (index >= total) index = 0;
      current = index;

      slides.forEach(function(slide, i) {
        slide.style.display = i === current ? 'block' : 'none';
      });

      allDots.forEach(function(dot, i) {
        dot.className = dot.className.replace(/w-6|w-1\.5/g, '').replace(/bg-primary\/60|bg-\[hsl\(160,20%,75%\)\]/g, '').trim();
        if (i === current) {
          dot.style.width = '1.5rem';
          dot.style.backgroundColor = 'hsl(160, 35%, 35%)';
        } else {
          dot.style.width = '0.375rem';
          dot.style.backgroundColor = 'hsl(160, 20%, 75%)';
        }
      });

      counters.forEach(function(c) { c.textContent = (current + 1) + '/' + total; });
    }

    // Event delegation for prev/next buttons (they're inside each slide)
    carouselEl.addEventListener('click', function(e) {
      var prevBtn = e.target.closest('[data-carousel-prev]');
      var nextBtn = e.target.closest('[data-carousel-next]');
      if (prevBtn) goToSlide(current - 1);
      if (nextBtn) goToSlide(current + 1);
    });

    allDots.forEach(function(dot, i) {
      dot.addEventListener('click', function() { goToSlide(i); });
    });

    goToSlide(0);
    setInterval(function() { goToSlide(current + 1); }, 8000);
  }

  /* ===== NAVBAR SCROLL EFFECT ===== */
  var nav = document.querySelector('nav');
  if (nav) {
    window.addEventListener('scroll', function() {
      if (window.scrollY > 50) {
        nav.style.backgroundColor = 'hsla(160, 55%, 5%, 0.95)';
        nav.style.backdropFilter = 'blur(12px)';
        nav.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
      } else {
        nav.style.backgroundColor = '';
        nav.style.backdropFilter = '';
        nav.style.boxShadow = '';
      }
    });
  }

  /* ===== FIX PROGRESS BARS (student stats) ===== */
  // Find all gradient bars (inner bars of progress indicators)
  var allBars = document.querySelectorAll('[class*="bg-gradient-to-r"][class*="from-primary"]');
  allBars.forEach(function(bar) {
    // Find the percentage text in the same row
    var row = bar.closest('[class*="flex"][class*="items-center"]');
    if (!row) row = bar.parentElement?.parentElement;
    if (!row) return;
    var texts = row.querySelectorAll('*');
    for (var i = 0; i < texts.length; i++) {
      var t = texts[i].textContent.trim();
      var match = t.match(/^(\d+)%$/);
      if (match) {
        var pct = parseInt(match[1]);
        bar.style.setProperty('width', pct + '%', 'important');
        bar.style.setProperty('min-width', pct > 0 ? '8px' : '0', 'important');
        bar.style.setProperty('transition', 'width 1s ease-out');
        break;
      }
    }
  });

  /* ===== EXIT-INTENT: ARTICLE POPUP / MOBILE BANNER ===== */
  (function() {
    var marquizFilled = false;
    var popupShown = false;
    var articleUrl = 'https://gorkybusiness.school/blog/'; // Замените на нужную статью
    var articleTitle = 'Как предприниматели масштабируют бизнес в кризис';

    // Track Marquiz completion via postMessage from iframe
    window.addEventListener('message', function(e) {
      if (e.data && (typeof e.data === 'string' && e.data.indexOf('marquiz') !== -1) ||
          (e.data && e.data.type && e.data.type.indexOf('marquiz') !== -1)) {
        marquizFilled = true;
      }
    });
    // Also check hash for marquiz completion
    window.addEventListener('hashchange', function() {
      if (window.location.hash.indexOf('marquiz') !== -1 && window.location.hash.indexOf('thanks') !== -1) {
        marquizFilled = true;
      }
    });

    function createPopup() {
      if (marquizFilled || popupShown) return;
      popupShown = true;

      var isMobile = window.innerWidth < 768;

      if (isMobile) {
        // MOBILE: bottom banner
        var banner = document.createElement('div');
        banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:10000;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:hsl(160,35%,12%);border-top:1px solid hsl(160,60%,42%);box-shadow:0 -4px 20px rgba(0,0,0,0.3);animation:slideUp .3s ease-out;';
        banner.innerHTML = '<a href="' + articleUrl + '" target="_blank" style="color:white;text-decoration:none;font-size:14px;font-weight:500;flex:1;"><span style="color:hsl(160,60%,42%);">Читайте:</span> ' + articleTitle + ' →</a><button style="background:none;border:none;color:hsl(160,60%,42%);font-size:24px;cursor:pointer;padding:0 4px;line-height:1;">×</button>';
        banner.querySelector('button').addEventListener('click', function() {
          banner.remove();
        });
        document.body.appendChild(banner);

        // Auto-hide after 15 seconds
        setTimeout(function() { if (banner.parentNode) banner.remove(); }, 15000);
      } else {
        // DESKTOP: overlay popup
        var overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.6);animation:fadeIn .2s ease-out;';
        var card = document.createElement('div');
        card.style.cssText = 'background:hsl(160,35%,12%);border:1px solid hsl(160,60%,42%);border-radius:16px;padding:40px;max-width:480px;width:90%;text-align:center;position:relative;';
        card.innerHTML = '<button style="position:absolute;top:12px;right:16px;background:none;border:none;color:hsl(160,25%,60%);font-size:28px;cursor:pointer;line-height:1;">×</button>' +
          '<p style="color:hsl(160,60%,42%);font-size:14px;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;">Уже уходите?</p>' +
          '<h3 style="color:white;font-size:22px;font-weight:700;margin-bottom:16px;line-height:1.3;">' + articleTitle + '</h3>' +
          '<p style="color:hsl(160,25%,60%);font-size:15px;margin-bottom:24px;">Узнайте, какие принципы стоят за ростом компаний от 1 до 100 млрд</p>' +
          '<a href="' + articleUrl + '" target="_blank" style="display:inline-block;padding:14px 32px;background:hsl(160,60%,42%);color:white;border-radius:9999px;text-decoration:none;font-weight:600;font-size:16px;">Читать статью</a>';
        card.querySelector('button').addEventListener('click', function() {
          overlay.remove();
        });
        overlay.addEventListener('click', function(e) {
          if (e.target === overlay) overlay.remove();
        });
        overlay.appendChild(card);
        document.body.appendChild(overlay);
      }
    }

    // DESKTOP trigger: cursor leaves page through top (exit-intent)
    if (window.innerWidth >= 768) {
      document.addEventListener('mouseout', function(e) {
        if (popupShown || marquizFilled) return;
        if (e.clientY < 0 && e.relatedTarget === null) {
          createPopup();
        }
      });
    }

    // MOBILE triggers: 60% scroll OR 20 seconds
    var scrollTriggered = false;
    window.addEventListener('scroll', function() {
      if (scrollTriggered || popupShown || marquizFilled) return;
      var scrollPercent = (window.scrollY + window.innerHeight) / document.documentElement.scrollHeight;
      if (scrollPercent > 0.6) {
        scrollTriggered = true;
        if (window.innerWidth < 768) createPopup();
      }
    });

    setTimeout(function() {
      if (window.innerWidth < 768 && !popupShown && !marquizFilled) {
        createPopup();
      }
    }, 20000);

    // Add CSS animation
    var style = document.createElement('style');
    style.textContent = '@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}';
    document.head.appendChild(style);
  })();

  // === Logo click → scroll to top ===
  var logoLink = document.querySelector('nav a[href="#"]');
  if (logoLink) {
    logoLink.addEventListener('click', function(e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

});
</script>
